name: Import TurnIA demo video

on:
  push:
    branches:
      - fix/launch-readiness-digilogix-20261004
    paths:
      - .github/workflows/import-turnia-demo-video.yml

permissions:
  contents: write

jobs:
  import-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/launch-readiness-digilogix-20261004
          fetch-depth: 0

      - name: Download demo video
        run: |
          mkdir -p assets/video
          curl -fL --retry 3 --retry-delay 2             "https://ucef1eb4c0fa7a161e20612eb065.dl.dropboxusercontent.com/cd/0/get/DJbBluWPg8PaeF9lSgRkKtp9JZNGuNMc4YEpoyWH2aQPr4WFCSV6Yhzlo7gRVGTX5EFIF7KPooXDiymbu_TP6MBOHpjHamEf_zgUO4G38iHrVff1r_-sJP6Ge0W2_vU28akLw1BtEt4u3RoZ14CA9PwAljSfE1eyq1jIrUSGxAeULw/file?c_luid=59fa313c"             -o assets/video/turnia-demo-v2.mp4
          test -s assets/video/turnia-demo-v2.mp4
          actual_size=$(wc -c < assets/video/turnia-demo-v2.mp4)
          test "$actual_size" -eq 559615

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/turnia-demo-v2.mp4
          git commit -m "feat(commercial): add TurnIA demo video"
          git push origin HEAD:fix/launch-readiness-digilogix-20261004
