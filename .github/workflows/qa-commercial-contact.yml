name: QA commercial contact endpoint

on:
  push:
    branches:
      - fix/launch-readiness-digilogix-20261004
    paths:
      - .github/workflows/qa-commercial-contact.yml

permissions:
  contents: write

jobs:
  qa-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-readiness-digilogix-20261004
      - name: Verify contact endpoint end-to-end without side effects
        shell: bash
        run: |
          set -euo pipefail
          url="https://turnia-pagina-jirnkpd4m-manriquedario-9726.vercel.app/api/commercial-request"
          payload='{"requestId":"b1a50f04-ea4c-4c5d-a0e1-8e6e0e4ea4e4","type":"sales_contact","email":"qa-turnia@example.com","fullName":"QA TurnIA","message":"Prueba técnica automática sin efectos","website":"honeypot-safe-test","source":"commercial_web"}'
          for i in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$url" || true)
            body=$(cat /tmp/body.txt 2>/dev/null || true)
            if [ "$status" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              printf "HTTP=%s\nBODY=%s\n" "$status" "$body" > qa-contact-result.txt
              exit 0
            fi
            sleep 4
          done
          printf "HTTP=%s\nBODY=%s\n" "$status" "$body" > qa-contact-result.txt
          cat qa-contact-result.txt
          exit 1
      - name: Commit QA result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-contact-result.txt
          git commit -m "test(commercial): record contact endpoint QA result" || exit 0
          git push origin HEAD:fix/launch-readiness-digilogix-20261004
