name: QA commercial contact endpoint

on:
  push:
    branches:
      - fix/launch-readiness-digilogix-20261004
    paths:
      - .github/workflows/qa-commercial-contact.yml

permissions:
  contents: write

jobs:
  qa-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-readiness-digilogix-20261004

      - name: Invoke commercial proxy handler without side effects
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test-contact.js <<'NODE'
          const handler = require(process.cwd() + '/api/commercial-request.js');

          const req = {
            method: 'POST',
            body: {
              requestId: 'b1a50f04-ea4c-4c5d-a0e1-8e6e0e4ea4e4',
              type: 'sales_contact',
              email: 'qa-turnia@example.com',
              fullName: 'QA TurnIA',
              message: 'Prueba técnica automática sin efectos',
              website: 'honeypot-safe-test',
              source: 'commercial_web'
            }
          };

          let statusCode = 200;
          let responseBody = null;
          const res = {
            setHeader() {},
            status(code) { statusCode = code; return this; },
            json(body) {
              responseBody = body;
              console.log(JSON.stringify({ statusCode, body }));
              if (statusCode !== 200 || !body || body.ok !== true) process.exitCode = 1;
              return this;
            }
          };

          Promise.resolve(handler(req, res)).catch((err) => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE
          node /tmp/test-contact.js | tee qa-contact-result.txt

      - name: Commit QA result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-contact-result.txt
          git commit -m "test(commercial): record contact proxy QA result" || exit 0
          git push origin HEAD:fix/launch-readiness-digilogix-20261004
